<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EMBA 네트워킹 모임</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f2ee;color:#0f2041;min-height:100vh}
.topbar{background:#0f2041;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:8px}
.brand-logo{width:30px;height:30px;border-radius:50%;background:#c8a84b;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#0f2041}
.brand-name{color:#fff;font-size:15px;font-weight:600}
.user-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.12);border-radius:20px;padding:5px 12px 5px 5px;cursor:pointer}
.user-av{width:22px;height:22px;border-radius:50%;background:#c8a84b;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#0f2041}
.user-nm{color:#fff;font-size:12px;font-weight:500}
.nav{background:#fff;border-bottom:1px solid #e5e5e5;display:flex;overflow-x:auto;padding:0 4px;position:sticky;top:52px;z-index:90}
.nav::-webkit-scrollbar{display:none}
.ntab{padding:12px 14px;font-size:12px;font-weight:500;color:#888;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px}
.ntab i{font-size:14px}
.ntab.on{color:#0f2041;border-bottom-color:#0f2041;font-weight:700}
.main{padding:16px;max-width:600px;margin:0 auto}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sec-ttl{font-size:16px;font-weight:700}
.cnt{font-size:11px;color:#999;background:#f0f0f0;padding:2px 9px;border-radius:20px;margin-left:6px;font-weight:600}
.btn-add{background:#0f2041;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.btn-add i{font-size:13px}
.cards{display:grid;gap:10px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:16px;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden}
.card:hover{border-color:#c5c5c5}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.card.t-professor::before{background:#c8a84b}
.card.t-birth_year::before{background:#7c5cbf}
.card.t-flash::before{background:#e05c2a}
.card.t-general::before{background:#378ADD}
.card.t-seminar::before{background:#2a9d8f}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.card-ttl{font-size:14px;font-weight:700;flex:1;line-height:1.4}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.bdg{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px}
.bdg.professor{background:#fdf6e3;color:#92600a}
.bdg.birth_year{background:#f0ebff;color:#5a3b9c}
.bdg.flash{background:#fff0eb;color:#b84a1e}
.bdg.general{background:#e8edf7;color:#1a3360}
.bdg.seminar{background:#e0f5f2;color:#1a6b61}
.bdg.voting{background:#dbeafe;color:#1e40af}
.bdg.confirmed{background:#d1fae5;color:#065f46}
.bdg.draft{background:#f3f4f6;color:#6b7280}
.card-desc{font-size:12px;color:#666;margin-bottom:8px;line-height:1.5}
.card-meta{display:flex;gap:12px;flex-wrap:wrap}
.mi{display:flex;align-items:center;gap:3px;font-size:11px;color:#999}
.mi i{font-size:12px}
.login-wrap{min-height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lcard{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:32px 24px;width:100%;max-width:400px}
.l-logo{width:52px;height:52px;border-radius:50%;background:#0f2041;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#c8a84b;margin:0 auto 14px}
.l-ttl{text-align:center;font-size:20px;font-weight:800;margin-bottom:3px}
.l-sub{text-align:center;font-size:13px;color:#999;margin-bottom:24px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;color:#555;margin-bottom:6px;letter-spacing:0.4px;text-transform:uppercase}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:10px 14px;font-size:14px;outline:none;background:#fafaf9}
.fld input:focus,.fld select:focus{border-color:#0f2041}
.fld textarea{resize:vertical;min-height:70px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lbtn{width:100%;height:44px;background:#0f2041;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.ltog{text-align:center;margin-top:14px;font-size:13px;color:#999}
.ltog a{color:#0f2041;font-weight:600;cursor:pointer}
.err{background:#fee2e2;color:#991b1b;font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:12px;display:none}
.hint-box{margin-top:14px;padding:12px 14px;background:#f9f9f7;border-radius:8px;border:1px solid #eee}
.hint-ttl{font-size:10px;font-weight:700;color:#999;margin-bottom:6px;text-transform:uppercase}
.hint-row{font-size:12px;color:#666;line-height:2}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:600px;padding:24px;max-height:90vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-ttl{font-size:18px;font-weight:700}
.modal-cls{background:none;border:none;cursor:pointer;color:#999;font-size:22px;line-height:1}
.det-bar{height:4px;border-radius:4px;margin-bottom:16px}
.det-ttl{font-size:20px;font-weight:800;margin-bottom:6px}
.det-desc{font-size:13px;color:#666;line-height:1.6;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:flex;align-items:center;gap:5px;background:#f5f5f3;border:1px solid #eee;padding:6px 12px;border-radius:20px;font-size:12px;color:#555}
.chip i{font-size:13px}
.vote-box{background:#f9f8f6;border-radius:12px;padding:16px;margin-bottom:14px}
.vote-box-ttl{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.vote-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.vbtn{height:40px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;color:#666}
.vbtn.agree{border-color:#065f46;color:#065f46}
.vbtn.agree:hover,.vbtn.agree.sel{background:#d1fae5}
.vbtn.disagree{border-color:#991b1b;color:#991b1b}
.vbtn.disagree:hover,.vbtn.disagree.sel{background:#fee2e2}
.vbtn.abstain:hover,.vbtn.abstain.sel{background:#f3f4f6}
.big-bar{background:#eee;border-radius:8px;height:10px;overflow:hidden;margin-bottom:8px}
.big-bar-fill{height:100%;border-radius:8px;background:#c8a84b;transition:width 0.6s}
.vote-stat{display:flex;justify-content:space-between;font-size:12px;color:#999}
.confirm-ok{background:#d1fae5;border:1px solid #6ee7b7;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.confirm-ok i{color:#065f46;font-size:20px}
.confirm-ok span{font-size:13px;color:#065f46;font-weight:600}
.btn-row{display:flex;gap:10px;margin-top:20px}
.btn-cancel{flex:1;height:44px;background:none;border:1px solid #ddd;border-radius:8px;font-size:14px;cursor:pointer;color:#666}
.btn-submit{flex:2;height:44px;background:#0f2041;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.btn-submit:disabled{opacity:0.5}
.ul{display:grid;gap:10px}
.uc{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.uav{width:40px;height:40px;border-radius:50%;background:#0f2041;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#c8a84b;flex-shrink:0}
.uinf{flex:1;min-width:0}
.unm{font-size:14px;font-weight:700}
.usub{font-size:12px;color:#999;margin-top:2px}
.yr-bdg{background:#f0ebff;color:#5a3b9c;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.spin{width:24px;height:24px;border:2px solid #eee;border-top-color:#0f2041;border-radius:50%;animation:sp 0.6s linear infinite;margin:48px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:56px 20px;color:#bbb}
.empty i{font-size:40px;display:block;margin-bottom:12px}
.empty p{font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f2041;color:#fff;padding:12px 24px;border-radius:12px;font-size:13px;font-weight:500;z-index:1000;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.flash-exp{display:flex;align-items:center;gap:4px;font-size:11px;color:#b84a1e;font-weight:600;margin-top:6px}

.cal-cell{background:#fff;min-height:64px;padding:6px 5px;cursor:pointer;transition:background 0.12s;position:relative;}
.cal-cell:hover{background:#f5f3ff;}
.cal-cell.empty{background:#fafafa;cursor:default;}
.cal-cell.cal-today .cal-num{background:#0f2041;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.cal-num{font-size:12px;font-weight:600;color:#333;line-height:1;}
.cal-cell.empty .cal-num{color:#ccc;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="brand-logo">E</div>
    <div class="brand-name">EMBA 네트워킹 모임</div>
  </div>
  <div id="user-chip" style="display:none" class="user-chip" onclick="logoutConfirm()">
    <div class="user-av" id="uav"></div>
    <div class="user-nm" id="unm"></div>
  </div>
</div>
<div id="screen"></div>
<div id="modal-backdrop" class="modal-backdrop" style="display:none">
  <div class="modal" id="modal-inner"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const API='https://emba-community-production.up.railway.app/api/v1';
let token=null,me=null,tab='all',flashList=[];
const $=id=>document.getElementById(id);
function toast(msg,ms=2500){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms);}
function showModal(html){$('modal-inner').innerHTML=html;$('modal-backdrop').style.display='flex';}
function closeModal(){$('modal-backdrop').style.display='none';}
$('modal-backdrop').addEventListener('click',e=>{if(e.target===$('modal-backdrop'))closeModal();});
async function api(path,opts={}){
  const h={'Content-Type':'application/json'};
  if(token)h['Authorization']='Bearer '+token;
  const r=await fetch(API+path,{...opts,headers:h});
  const d=await r.json();
  if(!r.ok)throw new Error(d.message?.message||d.message||'오류');
  return d.data;
}
function typeName(t){return{professor:'해피아워',birth_year:'위원회&클럽',flash:'번개',seminar:'세미나|수다',general:'일반'}[t]||t;}
function statusName(s){return{draft:'준비중',voting:'투표중',confirmed:'확정',cancelled:'취소'}[s]||s;}
function typeColor(t){return{professor:'#c8a84b',birth_year:'#7c5cbf',flash:'#e05c2a',seminar:'#2a9d8f',general:'#378ADD'}[t]||'#888';}
function fmtDate(d){if(!d)return'';return new Date(d).toLocaleDateString('ko-KR',{month:'short',day:'numeric'});}
function fmtDiff(d){const m=Math.max(0,Math.round((new Date(d)-Date.now())/60000));return m>60?Math.round(m/60)+'시간 후':m>0?m+'분 후':'곧 종료';}
function renderLogin(){
  $('user-chip').style.display='none';
  $('screen').innerHTML=`<div class="login-wrap"><div class="lcard">
    <div class="l-logo">E</div><div class="l-ttl">EMBA 네트워킹 모임</div><div class="l-sub">서울대학교 EMBA 18기 네트워킹</div>
    <div class="err" id="lerr"></div>
    <div class="fld"><label>이메일</label><input type="email" id="lemail" value="admin@emba.com"></div>
    <div class="fld"><label>비밀번호</label><input type="password" id="lpw" value="123456"></div>
    <button class="lbtn" id="lbtn" onclick="doLogin()">로그인</button>
    <div class="ltog">계정이 없으신가요? <a onclick="renderRegister()">회원가입</a></div>
    <div class="hint-box"><div class="hint-ttl">테스트 계정</div>
    <div class="hint-row">admin@emba.com / 123456<br>kim@emba.com / 123456</div></div>
  </div></div>`;
  $('lemail').onkeydown=e=>e.key==='Enter'&&doLogin();
  $('lpw').onkeydown=e=>e.key==='Enter'&&doLogin();
}
async function doLogin(){
  const btn=$('lbtn'),err=$('lerr');btn.textContent='로그인 중...';btn.disabled=true;err.style.display='none';
  try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('lemail').value,password:$('lpw').value})});token=d.accessToken;me=d.user;afterLogin();}
  catch(e){err.textContent=e.message;err.style.display='block';}
  btn.textContent='로그인';btn.disabled=false;
}
function renderRegister(){
  $('screen').innerHTML=`<div class="login-wrap"><div class="lcard">
    <div class="l-logo">E</div><div class="l-ttl">회원가입</div><div class="l-sub">EMBA 동기 커뮤니티</div>
    <div class="err" id="rerr"></div>
    <div class="fld"><label>이름</label><input type="text" id="rname" placeholder="실명"></div>
    <div class="fld"><label>이메일</label><input type="email" id="remail"></div>
    <div class="fld"><label>비밀번호</label><input type="password" id="rpw" placeholder="6자 이상"></div>
    <div class="r2"><div class="fld"><label>년생</label><input type="number" id="ryear" placeholder="1985"></div>
    <div class="fld"><label>회사</label><input type="text" id="rcomp"></div></div>
    <button class="lbtn" id="rbtn" onclick="doRegister()">가입하기</button>
    <div class="ltog"><a onclick="renderLogin()">로그인으로</a></div>
  </div></div>`;
}
async function doRegister(){
  const btn=$('rbtn'),err=$('rerr');btn.textContent='가입 중...';btn.disabled=true;err.style.display='none';
  try{const d=await api('/auth/register',{method:'POST',body:JSON.stringify({email:$('remail').value,password:$('rpw').value,name:$('rname').value,birthYear:Number($('ryear').value)||undefined,company:$('rcomp').value||undefined})});token=d.accessToken;me={name:$('rname').value};afterLogin();}
  catch(e){err.textContent=e.message;err.style.display='block';}
  btn.textContent='가입하기';btn.disabled=false;
}
function afterLogin(){$('user-chip').style.display='flex';$('uav').textContent=(me.name||'?').charAt(0);$('unm').textContent=me.name;loadTab('all');}
function logoutConfirm(){if(confirm(me.name+'님, 로그아웃?')){token=null;me=null;renderLogin();}}
function renderShell(content){
  $('screen').innerHTML=`<nav class="nav">
    <div class="ntab${tab==='calendar'?' on':''}" onclick="loadTab('calendar')"><i class="ti ti-calendar-month"></i>모임_캘린더</div>
    <div class="ntab${tab==='all'?' on':''}" onclick="loadTab('all')"><i class="ti ti-layout-grid"></i>전체</div>
    <div class="ntab${tab==='professor'?' on':''}" onclick="loadTab('professor')"><i class="ti ti-confetti"></i>해피아워</div>
    <div class="ntab${tab==='birth_year'?' on':''}" onclick="loadTab('birth_year')"><i class="ti ti-users-group"></i>위원회&amp;클럽</div>
    <div class="ntab${tab==='flash'?' on':''}" onclick="loadTab('flash')"><i class="ti ti-bolt"></i>번개</div>
    <div class="ntab${tab==='seminar'?' on':''}" onclick="loadTab('seminar')"><i class="ti ti-school"></i>세미나|수다</div>
    <div class="ntab${tab==='members'?' on':''}" onclick="loadTab('members')"><i class="ti ti-address-book"></i>네트워크DB</div>
  </nav><div class="main" id="mc">${content}</div>`;
}
async function loadTab(t){
  tab=t;renderShell('<div class="spin"></div>');
  try{
    if(t==='members'){const u=await api('/users');renderMembers(u);}
    else if(t==='flash'){flashList=await api('/flash-meetings/nearby?lat=37.461&lng=126.952&radius=50');renderFlash(flashList);}
    else if(t==='calendar'){const m=await api('/meetings');renderCalendar(m);}
    else if(t==='seminar'){const m=await api('/meetings?type=seminar');renderMeetings(m);}
    else{const m=await api('/meetings'+(t==='all'?'':'?type='+t));renderMeetings(m);}
  }catch(e){renderShell(`<div class="empty"><i class="ti ti-wifi-off"></i><p>${e.message}</p></div>`);}
}

// ───────────────────────────────
// 캘린더 뷰
// ───────────────────────────────
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth(); // 0-based
let calMeetings = [];

function renderCalendar(meetings) {
  calMeetings = meetings;
  renderShell(buildCalendarHTML());
}

function buildCalendarHTML() {
  const today = new Date();
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay  = new Date(calYear, calMonth + 1, 0);
  const startDow = firstDay.getDay(); // 0=일
  const totalDays = lastDay.getDate();
  const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const dayNames = ['일','월','화','수','목','금','토'];

  // 이 달의 모임 → { day: [meeting,...] }
  const dayMap = {};
  for (const m of calMeetings) {
    const d = m.scheduledAt || m.voteDeadline;
    if (!d) continue;
    const dt = new Date(d);
    if (dt.getFullYear()===calYear && dt.getMonth()===calMonth) {
      const k = dt.getDate();
      if (!dayMap[k]) dayMap[k] = [];
      dayMap[k].push(m);
    }
  }

  // 날짜 셀 생성
  let cells = '';
  // 빈 셀 (이전 달)
  for (let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  // 날짜 셀
  for (let d=1;d<=totalDays;d++) {
    const isToday = d===today.getDate()&&calMonth===today.getMonth()&&calYear===today.getFullYear();
    const events = dayMap[d]||[];
    const dotColors = {professor:'#c8a84b',birth_year:'#7c5cbf',flash:'#e05c2a',seminar:'#2a9d8f',general:'#378ADD'};
    const dots = events.slice(0,3).map(m=>`<span style="width:6px;height:6px;border-radius:50%;background:${dotColors[m.type]||'#888'};display:inline-block;flex-shrink:0"></span>`).join('');
    const moreLabel = events.length>3?`<span style="font-size:9px;color:#999">+${events.length-3}</span>`:'';
    cells += `<div class="cal-cell${isToday?' cal-today':''}" onclick="openCalDay(${d})">
      <div class="cal-num">${d}</div>
      <div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;align-items:center;min-height:12px">${dots}${moreLabel}</div>
      ${events.length?`<div style="font-size:9px;color:#555;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${events[0].title}</div>`:''}
    </div>`;
  }
  // 뒷 빈 셀
  const trailingCells = (startDow + totalDays) % 7;
  if (trailingCells > 0) for (let i=trailingCells;i<7;i++) cells += `<div class="cal-cell empty"></div>`;

  // 이번 달 모임 리스트
  const allThisMonth = Object.entries(dayMap).sort((a,b)=>Number(a[0])-Number(b[0]));
  const listHTML = allThisMonth.length ? allThisMonth.map(([day,ms])=>ms.map(m=>{
    const dotColor = {professor:'#c8a84b',birth_year:'#7c5cbf',flash:'#e05c2a',general:'#378ADD'}[m.type]||'#888';
    return `<div onclick="openDetail('${m.id}')" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-radius:10px;border:1px solid #eee;cursor:pointer;margin-bottom:6px">
      <div style="width:36px;height:36px;border-radius:8px;background:${dotColor}22;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <span style="font-size:14px;font-weight:800;color:${dotColor}">${day}</span>

function calNav(dir) {
  calMonth += dir;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  const mc = document.getElementById('mc');
  if (mc) mc.innerHTML = buildCalendarHTML();
}

function openCalDay(day) {
  const events = calMeetings.filter(m=>{
    const d = m.scheduledAt||m.voteDeadline;
    if(!d) return false;
    const dt = new Date(d);
    return dt.getFullYear()===calYear&&dt.getMonth()===calMonth&&dt.getDate()===day;
  });
  if (!events.length) return;
  if (events.length === 1) { openDetail(events[0].id); return; }
  const dotColor = {professor:'#c8a84b',birth_year:'#7c5cbf',flash:'#e05c2a',general:'#378ADD'};
  showModal(`
    <div class="modal-hdr"><div class="modal-ttl">${calMonth+1}월 ${day}일 모임</div><button class="modal-cls" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
    ${events.map(m=>`<div onclick="closeModal();openDetail('${m.id}')" style="display:flex;align-items:center;gap:10px;padding:12px;background:#f9f8f6;border-radius:10px;cursor:pointer;margin-bottom:8px">
      <div style="width:8px;height:8px;border-radius:50%;background:${dotColor[m.type]||'#888'};flex-shrink:0"></div>
      <div><div style="font-size:14px;font-weight:700">${m.title}</div>
      <div style="font-size:12px;color:#999;margin-top:2px">${m.location||''}</div></div>
    </div>`).join('')}
    <button class="btn-cancel" style="width:100%;margin-top:8px" onclick="closeModal()">닫기</button>`);
}

// ── 투표 방식 헬퍼 ──────────────────────────────────────────
// 해피아워: 4지선다 날짜 투표 (description에 JSON으로 옵션 저장)
// 위원회&클럽/번개/세미나: 일정 지정 + 참석 여부 투표

const HAPPY_TYPES = ['professor'];
const ATTEND_TYPES = ['birth_year','seminar','general','flash'];

function isHappyHour(type){ return HAPPY_TYPES.includes(type); }
function isAttendType(type){ return ATTEND_TYPES.includes(type); }

// description에 저장된 날짜 옵션 파싱
function parseDateOptions(desc){
  try {
    const m = (desc||'').match(/\[\[DATES:(.*?)\]\]/);
    if(m) return JSON.parse(m[1]);
  } catch(_){}
  return null;
}

      ${isAdmin?`<button onclick="event.stopPropagation();deleteMeeting('${m.id}','${m.title.replace(/'/g,"\\'")}',this)" style="position:absolute;top:10px;right:10px;background:#fee2e2;color:#991b1b;border:none;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:600;cursor:pointer;display:none" class="del-btn">삭제</button>`:''}

// ── openDetail ───────────────────────────────────────────────
async function openDetail(id){
  showModal('<div class="spin"></div>');
  try{
    const m = await api('/meetings/'+id);
    const isOrg = m.organizerId===me?.id;
    const isAdmin = me?.role==='admin';
    const color = typeColor(m.type);

    if(isHappyHour(m.type)){
      // 해피아워: 4지선다 날짜 투표
      const dateOpts = parseDateOptions(m.description);
      let vr = null;
      if(m.status==='voting'||m.status==='confirmed'){
        try{vr=await api('/votes/'+id+'/results');}catch(_){}
      }
      const realDesc = (m.description||'').replace(/\[\[DATES:.*?\]\]/,'').trim();
      const totalVotes = vr?.total||0;

      // 날짜 옵션별 투표 결과 (서버 votes를 활용해 choice에 인덱스 저장)
      const voteCounts = dateOpts ? dateOpts.map((_,i)=>{
        if(!vr) return 0;
        // agree=opt0, disagree=opt1, abstain=opt2, opt3 별도
        const map={'agree':0,'disagree':1,'abstain':2};
        return [vr.agree,vr.disagree,vr.abstain,vr.total-(vr.agree+vr.disagree+vr.abstain)][i]||0;
      }) : [];
      const maxVotes = Math.max(...voteCounts,1);

      showModal(`
        <div class="modal-hdr"><div class="modal-ttl">🥂 해피아워</div>
          <button class="modal-cls" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
        <div class="det-bar" style="background:${color}"></div>
        ${m.status==='confirmed'?`<div class="confirm-ok"><i class="ti ti-circle-check"></i><span>일정이 확정되었습니다!</span></div>`:''}
        <div class="det-ttl">${m.title}</div>
        ${realDesc?`<div class="det-desc">${realDesc}</div>`:''}
        <div class="chips">
          ${m.organizer?`<span class="chip"><i class="ti ti-user"></i>${m.organizer.name}</span>`:''}
          ${m.location?`<span class="chip"><i class="ti ti-map-pin"></i>${m.location}</span>`:''}
          ${m.voteDeadline?`<span class="chip"><i class="ti ti-clock"></i>마감 ${fmtDate(m.voteDeadline)}</span>`:''}
        </div>
        ${dateOpts?`<div class="vote-box">
          <div class="vote-box-ttl"><i class="ti ti-calendar-event"></i>날짜 투표 (${totalVotes}명 참여) — 가장 많은 날짜로 확정</div>
          ${dateOpts.map((d,i)=>{
            const cnt = voteCounts[i]||0;
            const pct = Math.round(cnt/Math.max(totalVotes,1)*100);
            const choiceMap=['agree','disagree','abstain','agree'][i]; // opt3은 agree 재사용 불가 → 4번째용 별도
            const isWinning = cnt===maxVotes&&totalVotes>0;
            return `<div style="margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                <span style="font-size:13px;font-weight:${isWinning?'700':'500'};color:${isWinning?color:'#333'}">${d}</span>
                <span style="font-size:12px;color:#999">${cnt}표 (${pct}%)</span>
              </div>
              <div style="background:#f0f0f0;border-radius:6px;height:8px;overflow:hidden">
                <div style="height:100%;border-radius:6px;background:${isWinning?color:'#c5c5c5'};width:${pct}%;transition:width 0.4s"></div>
              </div>
              ${m.status==='voting'?`<button onclick="castDateVote('${id}','${['agree','disagree','abstain'][i]||'agree'}',${i},this)" style="margin-top:5px;width:100%;height:32px;border:1px solid ${color};border-radius:7px;background:white;color:${color};font-size:12px;font-weight:600;cursor:pointer">이 날짜로 투표</button>`:''}
            </div>`;
          }).join('')}
        </div>`:`<div class="vote-box" style="text-align:center;color:#bbb;font-size:13px">날짜 옵션이 설정되지 않았습니다</div>`}
        <div class="btn-row">
          <button class="btn-cancel" onclick="closeModal()">닫기</button>
          ${m.status==='draft'&&isOrg?`<button class="btn-submit" onclick="startVoting('${id}')"><i class="ti ti-player-play" style="font-size:13px"></i> 투표 시작</button>`:''}
          ${m.status==='voting'&&isOrg?`<button class="btn-submit" style="background:#c8a84b" onclick="confirmMeeting('${id}')">최다 날짜로 확정</button>`:''}
          ${(isAdmin&&m.status!=='confirmed')?`<button onclick="deleteMeeting('${id}','${m.title.replace(/'/g,"\\'")}',this)" style="height:44px;padding:0 14px;background:#fee2e2;color:#991b1b;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">삭제</button>`:''}
        </div>`);
    } else {
      // 위원회&클럽 / 번개 / 세미나: 일정 지정 + 참석 여부 투표
      let vr = null;
      if(m.status==='voting'||m.status==='confirmed'){
        try{vr=await api('/votes/'+id+'/results');}catch(_){}
      }
      const attendCount = vr?.agree||0;
      const totalVoted = vr?.total||0;

      showModal(`
        <div class="modal-hdr"><div class="modal-ttl">${typeName(m.type)}</div>
          <button class="modal-cls" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
        <div class="det-bar" style="background:${color}"></div>
        ${m.status==='confirmed'?`<div class="confirm-ok"><i class="ti ti-circle-check"></i><span>모임이 확정되었습니다! 참석자 ${attendCount}명</span></div>`:''}
        <div class="det-ttl">${m.title}</div>
        ${m.description?`<div class="det-desc">${m.description}</div>`:''}
        <div class="chips">
          ${m.organizer?`<span class="chip"><i class="ti ti-user"></i>${m.organizer.name}</span>`:''}
          ${m.scheduledAt?`<span class="chip"><i class="ti ti-calendar"></i>${fmtDate(m.scheduledAt)}</span>`:''}
          ${m.location?`<span class="chip"><i class="ti ti-map-pin"></i>${m.location}</span>`:''}
          ${m.targetBirthYear?`<span class="chip"><i class="ti ti-cake"></i>${m.targetBirthYear}년생</span>`:''}
          ${m.voteDeadline?`<span class="chip"><i class="ti ti-clock"></i>마감 ${fmtDate(m.voteDeadline)}</span>`:''}
        </div>
        ${m.status==='voting'?`<div class="vote-box">
          <div class="vote-box-ttl"><i class="ti ti-users"></i>참석 여부 (${totalVoted}명 응답)</div>
          <div class="vote-btns">
            <button class="vbtn agree" onclick="castVote('${id}','agree',this)"><i class="ti ti-check"></i>참석</button>
            <button class="vbtn disagree" onclick="castVote('${id}','disagree',this)"><i class="ti ti-x"></i>불참</button>
            <button class="vbtn abstain" onclick="castVote('${id}','abstain',this)"><i class="ti ti-minus"></i>미정</button>
          </div>
          <div class="big-bar"><div class="big-bar-fill" style="width:${Math.round(attendCount/Math.max(totalVoted,1)*100)}%"></div></div>
          <div class="vote-stat">
            <span style="color:#065f46;font-weight:700">✓ 참석 ${attendCount}명</span>
            <span>불참 ${vr?.disagree||0}명</span>
            <span>미정 ${vr?.abstain||0}명</span>
          </div>
        </div>`:
        m.status==='confirmed'?`<div style="background:#d1fae5;border-radius:10px;padding:14px;text-align:center;margin-bottom:14px">
          <div style="font-size:28px;font-weight:800;color:#065f46">${attendCount}명</div>
          <div style="font-size:12px;color:#065f46;margin-top:4px">최종 참석자</div>
        </div>`:''}
        <div class="btn-row">
          <button class="btn-cancel" onclick="closeModal()">닫기</button>
          ${m.status==='draft'&&isOrg?`<button class="btn-submit" onclick="startVoting('${id}')"><i class="ti ti-player-play" style="font-size:13px"></i> 참석 투표 시작</button>`:''}
          ${m.status==='voting'&&isOrg?`<button class="btn-submit" style="background:#065f46" onclick="confirmMeeting('${id}')">참석 마감 확정</button>`:''}
          ${(isAdmin)?`<button onclick="deleteMeeting('${id}','${m.title.replace(/'/g,"\\'")}',this)" style="height:44px;padding:0 14px;background:#fee2e2;color:#991b1b;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">삭제</button>`:''}
        </div>`);
    }
  }catch(e){toast('오류: '+e.message);closeModal();}
}

async function castVote(mid,choice,btn){
  btn.disabled=true;btn.classList.add('sel');
  try{
    await api('/votes/'+mid,{method:'POST',body:JSON.stringify({choice})});
    toast({agree:'✓ 참석!',disagree:'불참 처리',abstain:'미정 처리'}[choice]);
    closeModal();loadTab(tab);
  }catch(e){toast(e.message);btn.disabled=false;btn.classList.remove('sel');}
}

async function castDateVote(mid,choice,optIdx,btn){
  btn.disabled=true;
  try{
    await api('/votes/'+mid,{method:'POST',body:JSON.stringify({choice})});
    toast('투표 완료!');closeModal();loadTab(tab);
  }catch(e){toast(e.message);btn.disabled=false;}
}

async function startVoting(mid){
  try{await api('/meetings/'+mid+'/start-voting',{method:'PATCH'});toast('투표 시작!');closeModal();loadTab(tab);}
  catch(e){toast(e.message);}
}

async function confirmMeeting(mid){
  try{await api('/meetings/'+mid+'/confirm',{method:'PATCH'});toast('확정!');closeModal();loadTab(tab);}
  catch(e){toast(e.message);}
}

// ── 관리자: 모임 삭제 ────────────────────────────────────────
async function deleteMeeting(id, title, btn){
  if(!confirm(`"${title}" 모임을 삭제하시겠습니까?\n삭제 후 복구 불가합니다.`)) return;
  if(btn) btn.disabled=true;
  try{
    await api('/meetings/'+id,{method:'DELETE'});
    toast('모임이 삭제되었습니다');
    closeModal();
    loadTab(tab);
  }catch(e){toast('삭제 오류: '+e.message);if(btn)btn.disabled=false;}
}

        <div class="usub">${[u.company,u.position].filter(Boolean).join(' · ')||u.email}</div>

        ${u.interests&&u.interests.length?`<div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap">${u.interests.slice(0,3).map(t=>`<span style="background:#f0ebff;color:#5a3b9c;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px">#${t}</span>`).join('')}</div>`:''}
      </div>
      ${u.birthYear?`<span class="yr-bdg">${u.birthYear}년생</span>`:''}
    </div>`).join('')}</div>`);
}

function openMemberDetail(id) {
  const u = memberList.find(x=>x.id===id);
  if (!u) return;
  const isMe = me && me.id === id;
  showModal(`
    <div class="modal-hdr">
      <div class="modal-ttl">${isMe?'내 프로필':'동기 프로필'}</div>
      <button class="modal-cls" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div style="text-align:center;margin-bottom:18px">
      <div style="width:64px;height:64px;border-radius:50%;background:#0f2041;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#c8a84b;margin:0 auto 10px">${(u.name||'?').charAt(0)}</div>
      <div style="font-size:20px;font-weight:800">${u.name}</div>
      ${u.birthYear?`<div style="font-size:12px;color:#999;margin-top:3px">${u.birthYear}년생</div>`:''}
    </div>
    <div class="chips" style="justify-content:center;margin-bottom:16px">
      ${u.company?`<span class="chip"><i class="ti ti-building"></i>${u.company}</span>`:''}
      ${u.position?`<span class="chip"><i class="ti ti-briefcase"></i>${u.position}</span>`:''}
      ${u.email?`<span class="chip"><i class="ti ti-mail"></i>${u.email}</span>`:''}
    </div>
    ${u.bio?`<div style="background:#f9f8f6;border-radius:10px;padding:14px 16px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px">자기소개</div>
      <div style="font-size:13px;color:#333;line-height:1.7">${u.bio.replace(/\n/g,'<br>')}</div>
    </div>`:'<div style="background:#f9f8f6;border-radius:10px;padding:14px 16px;margin-bottom:14px;text-align:center;color:#bbb;font-size:13px">자기소개가 없습니다</div>'}
    ${u.interests&&u.interests.filter(Boolean).length?`<div style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px">관심사</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${u.interests.filter(Boolean).map(t=>`<span style="background:#f0ebff;color:#5a3b9c;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px">#${t}</span>`).join('')}</div>
    </div>`:''}
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal()">닫기</button>
      ${isMe?`<button class="btn-submit" onclick="openEditProfile('${u.id}')">프로필 수정</button>`:''}
      ${(me?.role==='admin'&&!isMe)?`<button onclick="deleteUser('${u.id}','${u.name}')" style="height:44px;padding:0 14px;background:#fee2e2;color:#991b1b;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">삭제</button>`:''}
    </div>
  `);
}

function openEditProfile(id) {
  const u = memberList.find(x=>x.id===id)||{};
  const interestStr = (u.interests||[]).filter(Boolean).join(', ');
  showModal(`
    <div class="modal-hdr"><div class="modal-ttl">프로필 수정</div><button class="modal-cls" onclick="openMemberDetail('${id}')"><i class="ti ti-x"></i></button></div>
    <div class="fld"><label>이름</label><input type="text" id="ep-name" value="${u.name||''}"></div>
    <div class="r2">
      <div class="fld"><label>회사</label><input type="text" id="ep-company" value="${u.company||''}"></div>
      <div class="fld"><label>직책/직급</label><input type="text" id="ep-position" value="${u.position||''}"></div>
    </div>
    <div class="fld"><label>년생</label><input type="number" id="ep-year" value="${u.birthYear||''}" placeholder="예: 1985"></div>
    <div class="fld"><label>자기소개 / 하는 일</label>
      <textarea id="ep-bio" style="min-height:100px" placeholder="현재 하시는 일, 전문 분야, 커리어 스토리 등을 자유롭게 작성해주세요">${u.bio||''}</textarea>
    </div>
    <div class="fld"><label>관심사 <span style="font-weight:400;color:#999">(쉼표로 구분, 예: AI, 투자, 골프)</span></label>
      <input type="text" id="ep-interests" value="${interestStr}" placeholder="관심사를 쉼표로 구분해서 입력">
    </div>
    <div style="font-size:11px;color:#999;margin:-8px 0 12px;padding:0 2px">예) AI, 핀테크, 골프, 부동산투자, 스타트업</div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="openMemberDetail('${id}')">취소</button>
      <button class="btn-submit" id="ep-btn" onclick="submitProfile('${id}')">저장</button>
    </div>
  `);
}

async function submitProfile(id) {
  const btn=$('ep-btn');btn.disabled=true;btn.textContent='저장 중...';
  const rawInterests = $('ep-interests').value;
  const interests = rawInterests.split(',').map(s=>s.trim()).filter(Boolean);
  try {
    const updated = await api('/users/me', {method:'PATCH', body:JSON.stringify({
      name:$('ep-name').value.trim()||undefined,
      company:$('ep-company').value.trim()||undefined,
      position:$('ep-position').value.trim()||undefined,
      birthYear:Number($('ep-year').value)||undefined,
      bio:$('ep-bio').value.trim()||undefined,
      interests,
    })});
    // 로컬 memberList 업데이트
    const idx = memberList.findIndex(x=>x.id===id);
    if (idx>=0) memberList[idx] = {...memberList[idx], ...updated};
    // 상단 이름도 업데이트
    if (me && me.id===id) { me.name=updated.name; $('unm').textContent=updated.name; $('uav').textContent=(updated.name||'?').charAt(0); }
    toast('프로필 저장 완료!');
    openMemberDetail(id);
  } catch(e) { toast('오류: '+e.message); btn.disabled=false; btn.textContent='저장'; }
}
function openNewMeeting(){
  showModal(`<div class="modal-hdr"><div class="modal-ttl">새 모임 만들기</div><button class="modal-cls" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
    <div class="fld"><label>유형</label>
      <select id="nm-type" onchange="toggleMeetingForm()">
        <option value="professor">🥂 해피아워 (날짜 투표)</option>
        <option value="seminar">☕ 세미나|수다(무알콜)</option>
        <option value="birth_year">🏆 위원회&amp;클럽</option>
        <option value="flash2">⚡ 번개</option>
        <option value="general">📋 일반 모임</option>
      </select>
    </div>
    <div class="fld"><label>제목</label><input type="text" id="nm-title" placeholder="모임 제목"></div>
    <div class="fld"><label>설명 (선택)</label><textarea id="nm-desc" placeholder="모임 설명"></textarea></div>
    <div class="fld"><label>장소</label><input type="text" id="nm-loc" placeholder="장소"></div>
    <!-- 해피아워: 날짜 4지선다 -->
    <div id="nm-dates-section">
      <div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px">📅 후보 날짜 4개 (다수결 투표)</div>
      <div class="fld" style="margin-bottom:8px"><label>1안</label><input type="datetime-local" id="nm-d1"></div>
      <div class="fld" style="margin-bottom:8px"><label>2안</label><input type="datetime-local" id="nm-d2"></div>
      <div class="fld" style="margin-bottom:8px"><label>3안</label><input type="datetime-local" id="nm-d3"></div>
      <div class="fld" style="margin-bottom:8px"><label>4안</label><input type="datetime-local" id="nm-d4"></div>
    </div>
    <!-- 해피아워 외: 일정 지정 -->
    <div id="nm-schedule-section" style="display:none">
      <div class="r2">
        <div class="fld"><label>모임 일시</label><input type="datetime-local" id="nm-date"></div>
        <div class="fld"><label>년생 대상</label><input type="number" id="nm-year" placeholder="1985"></div>
      </div>
    </div>
    <div class="fld"><label>참석 마감일 (선택)</label><input type="datetime-local" id="nm-deadline"></div>
    <div class="btn-row"><button class="btn-cancel" onclick="closeModal()">취소</button>
    <button class="btn-submit" id="nm-btn" onclick="submitMeeting()">만들기</button></div>`);
}
function toggleMeetingForm(){
  const t = $('nm-type')?.value;
  const isHH = (t==='professor');
  $('nm-dates-section').style.display = isHH?'block':'none';
  $('nm-schedule-section').style.display = isHH?'none':'block';
}
async function submitMeeting(){
  const title=$('nm-title').value.trim();if(!title){toast('제목 입력');return;}
  const typeVal=$('nm-type').value;
  const actualType = typeVal==='flash2'?'flash':typeVal;
  const btn=$('nm-btn');btn.disabled=true;btn.textContent='생성 중...';
  try{
    let desc=$('nm-desc').value||undefined;
    let scheduledAt=undefined;
    // 해피아워: 날짜 옵션 description에 JSON 저장
    if(actualType==='professor'){
      const opts=['nm-d1','nm-d2','nm-d3','nm-d4'].map(id=>$( id)?.value).filter(Boolean).map(v=>new Date(v).toLocaleDateString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}));
      if(opts.length<2){toast('날짜 후보를 2개 이상 입력해주세요');btn.disabled=false;btn.textContent='만들기';return;}
      const datesJson = '[[DATES:'+JSON.stringify(opts)+']]';
      desc = (desc?desc+' ':'')+datesJson;
    } else {
      if($('nm-date')?.value) scheduledAt=new Date($('nm-date').value).toISOString();
    }
    const deadline=$('nm-deadline')?.value?new Date($('nm-deadline').value).toISOString():undefined;
    await api('/meetings',{method:'POST',body:JSON.stringify({
      type:actualType,title,description:desc,
      location:$('nm-loc').value||undefined,
      targetBirthYear:Number($('nm-year')?.value)||undefined,
      scheduledAt,voteDeadline:deadline,quorumPercent:50
    })});
    toast('모임 생성!');closeModal();loadTab(tab);
  }catch(e){toast('오류: '+e.message);btn.disabled=false;btn.textContent='만들기';}
}
function openNewFlash(){
  const exp=new Date(Date.now()+3600000).toISOString().slice(0,16);
  showModal(`<div class="modal-hdr"><div class="modal-ttl">번개 모임 열기 ⚡</div><button class="modal-cls" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
    <div class="fld"><label>제목</label><input type="text" id="fl-ttl" placeholder="지금 커피?"></div>
    <div class="fld"><label>장소명</label><input type="text" id="fl-loc" placeholder="관악 스타벅스"></div>
    <div class="r2"><div class="fld"><label>최대 인원</label><input type="number" id="fl-max" value="4"></div>
    <div class="fld"><label>반경 (km)</label><input type="number" id="fl-rad" value="3"></div></div>
    <div class="fld"><label>종료 시간</label><input type="datetime-local" id="fl-exp" value="${exp}"></div>
    <div class="btn-row"><button class="btn-cancel" onclick="closeModal()">취소</button>
    <button class="btn-submit" id="fl-btn" onclick="submitFlash()">번개 열기</button></div>`);
}
async function submitFlash(){
  const title=$('fl-ttl').value.trim(),loc=$('fl-loc').value.trim();if(!title||!loc){toast('제목/장소 입력');return;}
  const btn=$('fl-btn');btn.disabled=true;btn.textContent='생성 중...';
  try{await api('/flash-meetings',{method:'POST',body:JSON.stringify({title,locationName:loc,latitude:37.461,longitude:126.952,maxParticipants:Number($('fl-max').value)||4,radiusKm:Number($('fl-rad').value)||3,expiresAt:new Date($('fl-exp').value).toISOString()})});toast('번개 개설!');closeModal();loadTab('flash');}
  catch(e){toast('오류: '+e.message);btn.disabled=false;btn.textContent='번개 열기';}
}
